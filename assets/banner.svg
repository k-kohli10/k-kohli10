<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2f3a" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a2233" stop-opacity="1" />
      <stop offset="70%" stop-color="#1a2233" stop-opacity="1" />
      <stop offset="100%" stop-color="#1a2233" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#1a2233" />
  <rect width="1200" height="260" fill="url(#grid)" />

  <!-- service graph motif -->
  <g stroke="#30363d" stroke-width="1.4" fill="none">
    <line x1="880" y1="75" x2="1000" y2="125" />
    <line x1="1000" y1="125" x2="960" y2="215" />
    <line x1="1000" y1="125" x2="1120" y2="105" />
    <line x1="960" y1="215" x2="1080" y2="232" />
    <line x1="1120" y1="105" x2="1080" y2="232" />
    <line x1="880" y1="75" x2="960" y2="215" />
  </g>
  <g fill="#58a6ff">
    <circle cx="880" cy="75" r="4" />
    <circle cx="1000" cy="125" r="4" />
    <circle cx="1120" cy="105" r="4" />
    <circle cx="960" cy="215" r="4" />
    <circle cx="1080" cy="232" r="4" />
  </g>

  <rect width="1200" height="260" fill="url(#fade)" />

  <text x="60" y="140" font-family="Charter, Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#e6edf3">
    Kashyap Kohli
  </text>
  <text x="60" y="178" font-family="'Courier New', monospace" font-size="19" fill="#8b949e">
    Staff Site Reliability Engineer · Vancouver, BC
  </text>

  <text x="60" y="222" font-family="'Courier New', monospace" font-size="14" fill="#58a6ff">$</text>
  <text x="78" y="222" font-family="'Courier New', monospace" font-size="14" fill="#6e7681">uptime --check &#8594; 99.999% resolved · status: operational</text>

  <!-- terminal title bar -->
  <rect x="0" y="0" width="1200" height="34" fill="#10141f" />
  <line x1="0" y1="34" x2="1200" y2="34" stroke="#30363d" stroke-width="1" />
  <circle cx="24" cy="17" r="6" fill="#ff5f56" />
  <circle cx="44" cy="17" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="17" r="6" fill="#27c93f" />
  <text x="90" y="22" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">kashyap@github: ~</text>

  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#30363d" stroke-width="1" />
</svg>
