      <tspan x="54" y="352">into one command: health, dependencies, failover, rollback.</tspan>
    </text>
  </g>

  <!-- Card 4: Observability Pipeline -->
  <g>
    <rect x="615" y="220" width="555" height="190" rx="14" fill="url(#cardBgP)" stroke="#30363d"/>
    <rect x="615" y="220" width="4" height="190" rx="2" fill="#8957e5"/>

    <circle cx="657" cy="262" r="22" fill="#8957e526"/>
    <text x="657" y="262" text-anchor="middle" dominant-baseline="central" font-size="22">&#128202;</text>

    <text x="695" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#f5f5f7">Observability Pipeline</text>
    <text x="695" y="280" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8b949e">ROYAL BANK OF CANADA</text>

    <rect x="1060" y="238" width="90" height="24" rx="12" fill="#8957e520" stroke="#8957e5"/>
    <text x="1105" y="250" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#8957e5">DEC 2023</text>

    <line x1="615" y1="302" x2="1170" y2="302" stroke="#21262d"/>

    <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9aa4b2">
      <tspan x="639" y="332">Standardized logging schema and propagated trace IDs across</tspan>
      <tspan x="639" y="352">120+ microservices into one pane, cutting MTTD 30%.</tspan>
    </text>
