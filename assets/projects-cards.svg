      <tspan x="639" y="142">likely root cause via chat, cutting triage 40% for 50+ engineers.</tspan>
    </text>
  </g>

  <!-- Card 3: One-Touch DR Orchestrator -->
  <g>
    <rect x="30" y="220" width="555" height="190" rx="14" fill="url(#cardBgP)" stroke="#30363d"/>
    <rect x="30" y="220" width="4" height="190" rx="2" fill="#f0883e"/>

    <circle cx="72" cy="262" r="22" fill="#f0883e26"/>
    <text x="72" y="262" text-anchor="middle" dominant-baseline="central" font-size="22">&#129680;</text>

    <text x="110" y="258" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#f5f5f7">One-Touch DR Orchestrator</text>
    <text x="110" y="280" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8b949e">ROYAL BANK OF CANADA</text>

    <rect x="475" y="238" width="90" height="24" rx="12" fill="#f0883e20" stroke="#f0883e"/>
    <text x="520" y="250" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#f0883e">JUN 2025</text>

    <line x1="30" y1="302" x2="585" y2="302" stroke="#21262d"/>

    <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9aa4b2">
