<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBgP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#1a2233"/>
    </linearGradient>
  </defs>

  <!-- Card 1: RADAR -->
  <g>
    <rect x="30" y="10" width="555" height="190" rx="14" fill="url(#cardBgP)" stroke="#30363d"/>
    <rect x="30" y="10" width="4" height="190" rx="2" fill="#58a6ff"/>

    <circle cx="72" cy="52" r="22" fill="#58a6ff26"/>
    <text x="72" y="52" text-anchor="middle" dominant-baseline="central" font-size="22">&#128225;</text>

    <text x="110" y="48" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#f5f5f7">RADAR</text>
    <text x="110" y="70" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8b949e">OPEN SOURCE</text>

    <rect x="475" y="28" width="90" height="24" rx="12" fill="#58a6ff20" stroke="#58a6ff"/>
    <text x="520" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#58a6ff">AUG 2026</text>

    <line x1="30" y1="92" x2="585" y2="92" stroke="#21262d"/>

    <text font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9aa4b2">
      <tspan x="54" y="120" font-style="italic" fill="#6e7681">Real-time Anomaly Detection and Automated Response</tspan>
      <tspan x="54" y="142">Multi-agent AI intelligence for SRE incident workflows,</tspan>
      <tspan x="54" y="162">durable Postgres outbox pattern, zero lost handoffs.</tspan>
    </text>
  </g>

  <!-- Card 2: AI Incident Response Engine -->
  <g>
    <rect x="615" y="10" width="555" height="190" rx="14" fill="url(#cardBgP)" stroke="#30363d"/>
    <rect x="615" y="10" width="4" height="190" rx="2" fill="#3fb950"/>

    <circle cx="657" cy="52" r="22" fill="#3fb95026"/>
    <text x="657" y="52" text-anchor="middle" dominant-baseline="central" font-size="22">&#129302;</text>

    <text x="695" y="48" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#f5f5f7">AI Incident Response Engine</text>
    <text x="695" y="70" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#8b949e">ROYAL BANK OF CANADA</text>

    <rect x="1060" y="28" width="90" height="24" rx="12" fill="#3fb95020" stroke="#3fb950"/>
    <text x="1105" y="40" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#3fb950">OCT 2025</text>

