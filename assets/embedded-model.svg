    <text x="600" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#f5f5f7">Shape Reliability Design</text>
    <text x="600" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="0.5" fill="#8b949e">GROUNDED IN CHAOS ENGINEERING RESULTS</text>
