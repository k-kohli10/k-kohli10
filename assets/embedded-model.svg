    <line x1="210" y1="175" x2="990" y2="175" stroke="#3f4757"/>
    <line x1="210" y1="175" x2="210" y2="196" stroke="#3b82f6"/>
    <line x1="600" y1="175" x2="600" y2="196" stroke="#a78bfa"/>
    <line x1="990" y1="175" x2="990" y2="196" stroke="#3fb950"/>
  </g>
  <g>
    <polygon points="204,196 216,196 210,204" fill="#3b82f6"/>
    <polygon points="594,196 606,196 600,204" fill="#a78bfa"/>
    <polygon points="984,196 996,196 990,204" fill="#3fb950"/>
  </g>

  <!-- Bottom: 3 outcome boxes -->
  <g>
    <rect x="30" y="204" width="360" height="130" rx="14" fill="url(#cardBgE)" stroke="#30363d"/>
    <rect x="32" y="206" width="356" height="4" rx="2" fill="#3b82f6"/>
    <circle cx="210" cy="250" r="24" fill="#3b82f626"/>
    <text x="210" y="250" text-anchor="middle" dominant-baseline="central" font-size="22">&#129504;</text>
    <text x="210" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#f5f5f7">Gain Service Knowledge</text>
    <text x="210" y="320" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" letter-spacing="0.5" fill="#8b949e">DEEP EXPOSURE ACROSS ARCHITECTURES</text>
