  <text x="90" y="44" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#f5f5f7">EMBEDDED SRE MODEL</text>
  <text x="90" y="66" font-family="'Courier New', monospace" font-size="13" letter-spacing="1" fill="#58a6ff">INVOLVED FROM PLANNING TO PRODUCTION</text>

  <g font-family="'Courier New', monospace" font-size="14" font-weight="700">
