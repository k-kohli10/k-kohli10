    <text x="420" y="109" text-anchor="middle" dominant-baseline="central" fill="#8957e5">PLANNING</text>

    <text x="520" y="109" text-anchor="middle" dominant-baseline="central" fill="#6e7681">&#8594;</text>

    <rect x="540" y="92" width="120" height="34" rx="17" fill="#f0883e26" stroke="#f0883e"/>
    <text x="600" y="109" text-anchor="middle" dominant-baseline="central" fill="#f0883e">BUILD</text>

    <text x="680" y="109" text-anchor="middle" dominant-baseline="central" fill="#6e7681">&#8594;</text>

