name: GitHub Stats Card

on:
  # Regenerate daily at ~06:00 America/Vancouver (13:00 UTC).
  schedule:
    - cron: "0 13 * * *"
  # Allow manual runs from the Actions tab (use this for the first run).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Render stats card
        env:
          # Classic PAT with `repo` scope, stored as a repo secret.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python .github/scripts/render_stats.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --staged --quiet || git commit -m "Update github-stats.svg [skip ci]"
          git push
